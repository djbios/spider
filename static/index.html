<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Robot Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        .control-button {
            width: 80px;
            height: 80px;
            font-size: 24px;
            border-radius: 50%;
            margin: 10px;
        }

        .command-button {
            width: 100%;
            height: 50px;
            font-size: 16px;
            border-radius: 8px;
            margin: 10px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-row .col-4,
        .control-row .col-12 {
            padding: 0 5px;
        }

        #camera-stream {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .settings-label {
            font-weight: bold;
        }

        .slider {
            width: 100%;
        }

        .row {
            margin-bottom: 20px;
        }

        .col-md-6 {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Spider Robot Control</h1>
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="cameraIp" class="form-label">Camera IP Address</label>
                <input type="text" class="form-control" id="cameraIp" placeholder="Enter camera IP address"
                    value="192.168.178.125">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="img-container" style="transform: rotate(90deg); max-width: 70%;">
                    <!-- TODO hardcoded IP -->
                    <img id="camera-stream" src="http://192.168.178.125/stream" alt="Camera Stream">
                </div>
            </div>
            <div class="col-md-4">
                <div class="row control-row text-center mb-4">
                    <div class="col-12">
                        <button class="btn btn-primary control-button" id="move-forward">↑</button>
                    </div>
                </div>
                <div class="row control-row text-center mb-4">
                    <div class="col-4">
                        <button class="btn btn-primary control-button" id="move-left">←</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-danger control-button" id="stop">⛔</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-primary control-button" id="move-right">→</button>
                    </div>
                </div>
                <div class="row control-row text-center mb-4">
                    <div class="col-12">
                        <button class="btn btn-primary control-button" id="move-backward">↓</button>
                    </div>
                </div>
                <div class="row mb-3">
                    <table id="stats-table" class="table">
                        <tbody id="stats-tbody">
                            <!-- Dynamic rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-4">
                <div class="row">
                    <div class="command container" id="set-light-brightness">
                        <label for="brightness">Brightness %</label>
                        <input type="range" id="brightness" min="0" max="100" value="0" class="w-100 input-type-int"
                            oninput="this.nextElementSibling.value = this.value">
                        <output>0</output>
                        <button class="command-button btn btn-primary">Set light brightness</button>
                    </div>
                    <div class="command container" id="wiggle">
                        <label for="movements">Movements number</label>
                        <input type="range" , id="movements" min="1" max="30" value="10" class="w-100 input-type-int"
                            oninput="this.nextElementSibling.value = this.value">
                        <output>10</output>
                        <button class="command-button btn btn-primary">Wiggle</button>
                    </div>
                    <div class="command container" id="leg-test">
                        <button class="command-button btn btn-primary">Leg test</button>
                    </div>
                    <div class="command container" id="to-zero">
                        <button class="command-button btn btn-primary">To zero</button>
                    </div>
                    <div class="command container" id="calibrate-zero">
                        <button class="command-button btn btn-primary">Calibrate zero</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#cameraIp').on('change', function () {
                const camIp = $(this).val();
                $('#camera-stream').attr('src', `http://${camIp}/stream`);
            });

            $('.command-button').on('click', function () {
                const params = {};

                // Find the specific command container for the clicked button
                const commandContainer = $(this).closest('.command');
                const action = commandContainer.attr('id');

                // Collect all inputs within the specific command container
                commandContainer.find('input').each(function () {
                    const id = $(this).attr('id');
                    let value = $(this).val();

                    // Determine type based on class
                    if ($(this).hasClass('input-type-int')) {
                        value = parseInt(value, 10); // Convert to integer
                    } else if ($(this).hasClass('input-type-float')) {
                        value = parseFloat(value); // Convert to float
                    } else if ($(this).hasClass('input-type-str')) {
                        value = String(value); // Convert to string
                    }

                    params[id] = value; // Use id as the key and value as the value
                });


                // Add action to the params
                const body = {
                    action: action,
                    params: params
                };

                $.ajax({
                    url: `/api/command`,
                    type: 'POST',
                    data: JSON.stringify(body),
                    contentType: 'application/json',
                    success: function (data) {
                        console.log(data);
                    }
                });
            });

            // Function to update stats table dynamically
            function updateStatsTable(data) {
                var statsTbody = $('#stats-tbody');
                statsTbody.empty(); // Clear existing rows

                // Iterate over each stat in the data
                for (var key in data) {
                    if (data.hasOwnProperty(key)) {
                        var value = data[key];
                        // Convert value to a readable string if it's an array
                        var valueText = Array.isArray(value) ? value.join(', ') : value;

                        // Create a new row for the stat
                        var newRow = `<tr>
                            <td>${key.replace(/_/g, ' ')}</td>
                            <td>${valueText}</td>
                          </tr>`;
                        statsTbody.append(newRow);
                    }
                }
            }
            
            // Set interval to fetch and update stats every 2 seconds
            var intervalId = window.setInterval(function () {
                $.get(`/api/stats`, function (data) {
                    updateStatsTable(data);
                });
            }, 2000);
        });
    </script>
</body>

</html>
