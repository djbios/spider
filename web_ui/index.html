<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Robot Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        .control-button {
            width: 80px;
            height: 80px;
            font-size: 24px;
            border-radius: 50%;
            margin: 10px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-row .col-4,
        .control-row .col-12 {
            padding: 0 5px;
        }

        #camera-stream {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .settings-label {
            font-weight: bold;
        }

        .slider {
            width: 100%;
        }

        .row {
            margin-bottom: 20px;
        }

        .col-md-6 {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Spider Robot Control</h1>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="cameraIp" class="form-label">Camera IP Address</label>
                <input type="text" class="form-control" id="cameraIp" placeholder="Enter camera IP address" value="192.168.178.125">
            </div>
            <div class="col-md-6">
                <label for="apiIp" class="form-label">Robot API IP Address</label>
                <input type="text" class="form-control" id="apiIp" placeholder="Enter API IP address" value="192.168.178.125">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="img-container" style="transform: rotate(90deg); max-width: 70%;">
                    <img id="camera-stream" src="http://192.168.178.125/stream" alt="Camera Stream">
                </div>
            </div>
            <div class="col-md-6">
                <div class="row control-row text-center mb-4">
                    <div class="col-12">
                        <button class="btn btn-primary control-button" id="move-forward">↑</button>
                    </div>
                </div>
                <div class="row control-row text-center mb-4">
                    <div class="col-4">
                        <button class="btn btn-primary control-button" id="move-left">←</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-danger control-button" id="stop">⛔</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-primary control-button" id="move-right">→</button>
                    </div>
                </div>
                <div class="row control-row text-center mb-4">
                    <div class="col-12">
                        <button class="btn btn-primary control-button" id="move-backward">↓</button>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="lightSwitch" class="settings-label">Light</label>
                        <select class="form-select" id="lightSwitch">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="speedControl" class="settings-label">Speed</label>
                        <input type="range" class="form-range slider" id="speedControl" min="1" max="10">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#cameraIp').on('change', function () {
                const camIp = $(this).val();
                $('#camera-stream').attr('src', `http://${camIp}/stream`);
            });

            $('.control-button').on('click', function () {
                const action = $(this).attr('id');
                const apiIp = $('#apiIp').val();
                $.post(`http://${apiIp}/control`, { action: action }, function (data) {
                    console.log(data);
                });
            });

            $('#lightSwitch').on('change', function () {
                const lightState = $(this).val();
                const apiIp = $('#apiIp').val();
                $.post(`http://${apiIp}/control`, { action: 'light', state: lightState }, function (data) {
                    console.log(data);
                });
            });

            $('#speedControl').on('input', function () {
                const speed = $(this).val();
                const apiIp = $('#apiIp').val();
                $.post(`http://${apiIp}/control`, { action: 'speed', value: speed }, function (data) {
                    console.log(data);
                });
            });
        });
    </script>
</body>

</html>
